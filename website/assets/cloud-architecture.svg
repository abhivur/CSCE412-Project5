<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" role="img" aria-labelledby="title desc"><title id="title">GBM Cloud reference architecture</title><desc id="desc">Visitors reach CloudFront over HTTPS. CloudFront accesses a private S3 origin through OAC. Route 53 provides DNS and ACM supplies its certificate.</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#d9ccd7"/></pattern><linearGradient id="wash" x2="0" y2="1"><stop stop-color="#fcfafc"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><rect width="600" height="390" fill="url(#wash)"/><rect x="20" y="18" width="560" height="350" rx="14" fill="url(#dots)" opacity=".65"/><path d="M133 96c0-24 19-43 44-43 8-38 63-48 84-14 31-5 54 22 46 47h-91" fill="none" stroke="#e9dce5" stroke-width="1.4"/><path d="M450 288c0-17 14-30 31-30 6-27 44-34 59-10 21-3 37 16 32 33h-61" fill="none" stroke="#e9dce5" stroke-width="1.4"/><g stroke="#c8aab9" stroke-width="1.4" fill="none"><path d="M164 206h54m164 0h54"/><path d="m211 202 6 4-6 4m218-8 6 4-6 4"/><path d="M300 103v50m-4-7 4 6 4-6"/><path d="M300 260v36h-96m7-4-7 4 7 4"/><path d="M300 296h96m-7-4 7 4-7 4"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="231" y="48" width="138" height="55" rx="9" fill="#fff" stroke="#e5dce6"/><g fill="none" stroke="#987284" stroke-width="1.5"><circle cx="254" cy="75" r="9"/><path d="M245 75h18m-9-9c5 5 5 13 0 18-5-5-5-13 0-18"/></g><text x="308" y="73" font-size="12" fill="#4c3b4c">Your visitor</text><text x="308" y="88" font-size="8" fill="#a08a9b">HTTPS request</text><rect x="35" y="167" width="129" height="78" rx="11" fill="#fff" stroke="#e4dbe6"/><g fill="none" stroke="#a78a9b" stroke-width="1.6"><rect x="84" y="180" width="29" height="18" rx="3"/><path d="M91 203h15m-7-5v5"/></g><text x="99" y="221" font-size="12" fill="#5d4a60">Custom domain</text><text x="99" y="235" font-size="8" fill="#a38b9f">A name of your own</text><rect x="219" y="156" width="162" height="102" rx="13" fill="#f9f0f4" stroke="#bd8ea5"/><g fill="none" stroke="#7a3b57" stroke-width="1.9"><path d="M285 191a10 10 0 0 1-1-20 12 12 0 0 1 23-2 11 11 0 0 1 1 22Z"/></g><text x="300" y="219" font-size="16" fill="#6b293d" font-weight="bold">CloudFront</text><text x="300" y="239" font-size="9" fill="#a0758e">Secure edge delivery</text><rect x="436" y="167" width="129" height="78" rx="11" fill="#fff" stroke="#e4dbe6"/><g fill="none" stroke="#a78a9b" stroke-width="1.6"><ellipse cx="500" cy="184" rx="13" ry="5"/><path d="M487 184v15c0 7 26 7 26 0v-15m-26 8c0 7 26 7 26 0"/></g><text x="500" y="221" font-size="12" fill="#5d4a60">Private S3</text><text x="500" y="235" font-size="8" fill="#a38b9f">Your content, protected</text><text x="190" y="194" font-size="7" fill="#b28ba0">DNS</text><text x="408" y="194" font-size="7" fill="#b28ba0">OAC</text><rect x="115" y="278" width="90" height="39" rx="7" fill="#fff" stroke="#e6dce8"/><text x="160" y="296" font-size="10" fill="#7b5b73">Route 53</text><text x="160" y="308" font-size="7" fill="#a58da1">Domain routing</text><rect x="395" y="278" width="90" height="39" rx="7" fill="#fff" stroke="#e6dce8"/><text x="440" y="296" font-size="10" fill="#7b5b73">ACM</text><text x="440" y="308" font-size="7" fill="#a58da1">TLS certificate</text><text x="300" y="355" font-size="7" fill="#ab95a5" letter-spacing="1.8">A CONNECTED FOUNDATION FOR YOUR IDEAS</text></g></svg>
